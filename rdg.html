<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Réserve des Gourmands</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="stylesheet" href="CSS/rdg.css">
</head>
<body>

<!-- ============================================================
     CONNEXION
============================================================ -->
<div id="vue-connexion" class="conteneur">
  <div class="entete">
    <div class="entete-photo">
      <img src="https://images.unsplash.com/photo-1514237487632-b60bc844a47d?q=80&w=1920&auto=format&fit=crop" alt="La Réserve des Gourmands">
      <div class="entete-titre">La<br>Réserve<br>des<br>Gourmands</div>
    </div>
  </div>
  <div class="contenu">
    <div class="bloc">
      <input class="champ" id="mdp" type="password" autocomplete="current-password" placeholder="Mot de passe">
    </div>
    <button class="bouton bouton-brun bouton-pleine" id="btn-entrer">Entrer</button>
    <div class="message message-erreur" id="msg-connexion"></div>
  </div>
</div>

<!-- ============================================================
     ENTRER UN ARTICLE
============================================================ -->
<div id="vue-app" class="conteneur" hidden>
  <div class="entete">
    <div class="titre" style="margin-top: var(--espace-xl);">Entrer un article</div>
  </div>
  <div class="contenu">

    <!-- Entonnoir -->
    <div class="bloc">
      <div class="label">Catégorie</div>
      <select class="champ" id="cat"></select>
    </div>

    <div class="bloc" id="bloc-souscat" hidden>
      <div class="label">Sous-catégorie</div>
      <select class="champ" id="souscat"></select>
    </div>

    <div class="bloc" id="bloc-produit" hidden>
      <div class="label">Produit</div>
      <select class="champ" id="produit"></select>
    </div>

    <div class="bloc" id="bloc-nom" hidden>
      <div class="label">Nom du nouveau produit</div>
      <input class="champ" id="nom" placeholder="Ex. Café moulu">
    </div>

    <!-- Détails produit -->
    <div id="bloc-details" hidden>
      <div class="bloc">
        <div class="label">Marque</div>
        <input class="champ" id="marque" placeholder="Optionnel">
      </div>
      <div class="bloc">
        <div class="label">Format</div>
        <input class="champ" id="format" placeholder="Ex. 500 g, 2 L (optionnel)">
      </div>
    </div>

    <!-- Endroits (1 à N) -->
    <div id="bloc-endroits" hidden>
      <div class="label" style="font-size: var(--texte-normal); color: var(--brun-fonce); font-weight: var(--poids-fort);">Où ça va</div>
      <div id="endroits"></div>
      <button class="bouton bouton-petit" id="btn-endroit" type="button" style="margin-top: var(--espace-s);">+ un autre endroit</button>
    </div>

    <button class="bouton bouton-vert bouton-pleine" id="btn-enregistrer" hidden style="margin-top: var(--espace-l);">Enregistrer</button>
    <div class="message" id="msg"></div>

    <button class="bouton bouton-pleine" id="lien-deco" style="margin-top: var(--espace-xl);">Se déconnecter</button>

  </div>
</div>

<script src="JS/coffre.js"></script>
<script src="JS/entree.js"></script>
</body>
</html>
