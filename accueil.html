<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Réserve des Gourmands</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
</head>
<body>

<div class="conteneur">

  <div class="entete">
    <div class="entete-photo">
      <img src="https://images.unsplash.com/photo-1514237487632-b60bc844a47d?q=80&w=1920&auto=format&fit=crop" alt="La Réserve des Gourmands">
      <div class="entete-titre">La<br>Réserve<br>des<br>Gourmands</div>
    </div>
  </div>

  <div class="contenu">

    <!-- Les 4 blocs (fonctions à brancher plus tard) -->
    <div class="grille" style="margin-bottom: var(--espace-xl);">
      <button class="bouton bouton-brun bouton-grand"><span class="icone"><img src="https://i.ibb.co/SDD5JZfq/scan.png" alt=""></span></button>
      <button class="bouton bouton-vert bouton-grand"><span class="icone"><img src="https://i.ibb.co/xqZ284dg/loupe2.png" alt=""></span></button>
      <button class="bouton bouton-orange bouton-grand"><span class="icone">✓</span></button>
      <button class="bouton bouton-bleu bouton-grand"><span class="icone"><img src="https://i.ibb.co/dwxHdy6v/cards.png" alt=""></span></button>
    </div>

    <!-- Les accordéons (contenu à décider plus tard) -->
    <div class="accordeon"><div class="accordeon-tete" data-toggle>Stock épuisé <span class="accordeon-fleche">▼</span></div><div class="accordeon-corps" hidden><div class="accordeon-item"><span class="texte-petit texte-pale">—</span></div></div></div>
    <div class="accordeon"><div class="accordeon-tete" data-toggle>Réserve vide <span class="accordeon-fleche">▼</span></div><div class="accordeon-corps" hidden><div class="accordeon-item"><span class="texte-petit texte-pale">—</span></div></div></div>
    <div class="accordeon"><div class="accordeon-tete" data-toggle>À consommer bientôt <span class="accordeon-fleche">▼</span></div><div class="accordeon-corps" hidden><div class="accordeon-item"><span class="texte-petit texte-pale">—</span></div></div></div>
    <div class="accordeon"><div class="accordeon-tete" data-toggle>En spécial cette semaine <span class="accordeon-fleche">▼</span></div><div class="accordeon-corps" hidden><div class="accordeon-item"><span class="texte-petit texte-pale">—</span></div></div></div>
    <div class="accordeon"><div class="accordeon-tete" data-toggle>Listes en attente <span class="accordeon-fleche">▼</span></div><div class="accordeon-corps" hidden><div class="accordeon-item"><span class="texte-petit texte-pale">—</span></div></div></div>

  </div>
</div>

<script src="accueil.js"></script>
</body>
</html>
