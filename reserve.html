<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Réserve des Gourmands</title>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
</head>
<body>

<!-- ============================================================
     CONNEXION
============================================================ -->
<div id="vue-connexion" class="conteneur">
  <div class="entete">
    <div class="entete-photo">
      <img src="https://images.unsplash.com/photo-1514237487632-b60bc844a47d?q=80&w=1920&auto=format&fit=crop" alt="La Réserve des Gourmands">
      <div class="entete-titre">La<br>Réserve<br>des<br>Gourmands</div>
    </div>
  </div>
  <div class="contenu">
    <div class="titre">Mot de passe</div>
    <div class="bloc">
      <input class="champ" id="mdp" type="password" autocomplete="current-password" placeholder="Mot de passe">
    </div>
    <button class="bouton bouton-brun bouton-pleine" id="btn-entrer">Entrer</button>
    <div class="message message-erreur" id="msg-connexion"></div>
  </div>
</div>

<!-- ============================================================
     APPLICATION — Entrée des produits
============================================================ -->
<div id="vue-app" class="conteneur" hidden>
  <div class="entete">
    <div class="titre" style="margin-top: var(--espace-xl);">Entrée des produits</div>
  </div>
  <div class="contenu">

    <div class="bloc">
      <input class="champ" id="nom" type="text" placeholder="Nom du produit *">
    </div>
    <div class="bloc">
      <input class="champ" id="unite" type="text" list="unites" placeholder="Unité (ex. unité, sac, livre)">
      <datalist id="unites">
        <option value="unité"></option><option value="sac"></option><option value="boîte"></option>
        <option value="livre"></option><option value="kg"></option><option value="g"></option>
        <option value="L"></option><option value="ml"></option><option value="paquet"></option>
      </datalist>
    </div>
    <div class="bloc">
      <div class="label">Quantité</div>
      <div class="compteur">
        <button class="compteur-btn" id="q-moins" type="button">−</button>
        <div class="compteur-valeur" id="qte">1</div>
        <button class="compteur-btn" id="q-plus" type="button">+</button>
      </div>
    </div>

    <button class="bouton bouton-vert bouton-pleine" id="btn-ajouter">Ajouter</button>
    <div class="message" id="msg-ajout"></div>

    <div class="accordeon" style="margin-top: var(--espace-xl);">
      <div class="accordeon-tete ouvert" id="tete-transit">
        En transit <span class="accordeon-fleche">▼</span>
      </div>
      <div id="liste-transit">
        <div class="accordeon-item"><span class="texte-petit texte-pale">Chargement…</span></div>
      </div>
    </div>

    <button class="bouton bouton-pleine" id="lien-deco" style="margin-top: var(--espace-l);">Se déconnecter</button>

  </div>
</div>

<script src="coffre.js"></script>
<script src="entree.js"></script>
</body>
</html>
